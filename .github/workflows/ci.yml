name: ci

on:
  push:
    branches: [main, "claude/**", "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Sprint 1 freeze guard (explicit)
        run: pytest -q tests/test_sprint1_freeze.py

      - name: Phase 1 gate canary (explicit)
        run: pytest -q tests/test_phase1_gate.py
