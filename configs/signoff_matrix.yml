    title: "Appendix B — strategy specification & registry rules"
    signer_role: "Director sponsor"
    required_for: "v0.2_code"
    signed: true
    signed_by: "DIR-01"
    signed_at_iso: "2026-05-09T10:00:00-04:00"
    notes: "Pseudonymous OWNERS.md ID; real-name mapping off-repo."

