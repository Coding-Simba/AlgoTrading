# Sign-off matrix — v1.4-r1.
# Tracks the five pre-code sign-offs (Appendices B, C, D, E, H) plus the
# downstream phase gates. Pre-code rows must be signed before any v0.2
# strategy code lands; phase-gate rows are signed at each subsequent phase.
#
# signer_role values mirror docs/OWNERS.md.
# signed_by uses pseudonymous IDs from docs/OWNERS.md (DIR-01, RISK-01,
# ENG-01, QUANT-01, ...). Real-name mapping is held off-repo by the
# Director Sponsor and the Risk Reviewer.
# required_for ∈ {v0.2_code, v0.2_backtest, validation, paper, live, scaleup}
# signed_at_iso must be ISO-8601 (e.g., "2026-05-09T10:00:00-04:00").

rows:
